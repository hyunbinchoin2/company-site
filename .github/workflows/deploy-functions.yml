name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy send-newsletter --project-ref "$PROJECT_REF"
      - run: supabase functions deploy track --no-verify-jwt --project-ref "$PROJECT_REF"
      - run: supabase functions deploy unsubscribe --no-verify-jwt --project-ref "$PROJECT_REF"
