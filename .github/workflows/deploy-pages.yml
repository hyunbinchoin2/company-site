# web/ 폴더를 GitHub Pages 로 배포합니다.
# - main 에 push 할 때
# - 30분마다 자동으로 (새 블로그 글의 공유 썸네일 페이지를 만들기 위해)
# - Actions 탭에서 Run workflow 를 눌렀을 때
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/**", ".github/workflows/deploy-pages.yml"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 공유 썸네일 페이지 만들기
        run: node tools/build-share.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
