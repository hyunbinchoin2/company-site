<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 | 엔투소프트</title>
  <!-- 링크 공유 썸네일 (__SITE_URL__ 은 배포할 때 config.js 의 SITE_URL 로 자동 교체) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="엔투소프트">
  <meta property="og:title" content="엔투소프트 블로그">
  <meta property="og:description" content="저축은행 여신관리시스템 구축 전문 기업. 통합여신관리시스템 nTree.NEXT AI, 종합우편 DX서비스 QUPID 등 금융 IT 솔루션을 만듭니다.">
  <meta property="og:image" content="__SITE_URL__/assets/img/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="__SITE_URL__/blog.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23A42F2B'/></svg>">
  <link rel="stylesheet" href="./assets/css/site.css">
</head>
<body>
  <div data-header></div>
  <main>
    <article class="article" id="article"><div class="article-inner"><p class="loading">글을 불러오는 중입니다…</p></div></article>
  </main>
  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module">
    import { C, esc, fmtDate, mountChrome, bindSubscribeForms, subscribeFormHtml } from "./assets/js/site.js";
    import { getPostBySlug, logPageView } from "./assets/js/api.js";
    import { CONFIG } from "./assets/js/config.js";

    mountChrome("blog");
    const params = new URLSearchParams(location.search);
    const slug = params.get("slug");
    const el = document.getElementById("article");

    const post = slug ? await getPostBySlug(slug).catch(() => null) : null;
    if (!post) {
      el.innerHTML = `<div class="article-inner"><h1>글을 찾을 수 없습니다</h1>
        <p>주소가 바뀌었거나 비공개로 전환된 글입니다.</p><a class="btn" href="./blog.html">블로그 목록으로</a></div>`;
    } else {
      document.title = `${post.title} | ${C.name}`;
      el.innerHTML = `
        <div class="article-inner">
          <span class="cat">${esc(post.category || "")}</span>
          <h1>${esc(post.title)}</h1>
          <div class="article-meta">
            <span class="date">${fmtDate(post.published_at)}</span>
            <button class="share-btn" id="share" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
              <span>공유하기</span></button>
          </div>
        </div>
        ${post.cover_url ? `<div class="cover"><img src="${esc(post.cover_url)}" alt=""></div>` : `<div style="height:32px"></div>`}
        <div class="article-inner prose">${DOMPurify.sanitize(marked.parse(post.content || ""))}</div>
        <aside class="article-end" id="subscribe">
          <h2>이런 글을 메일로 받아보세요</h2>
          <p>새 글이 올라오면 한 달에 한 번 모아서 보내드립니다.</p>
          ${subscribeFormHtml()}
        </aside>`;
      bindSubscribeForms();

      // 표는 휴대폰에서 옆으로 밀어 볼 수 있게, 사진은 설명(대체 글)을 사진 아래에 표시
      const prose = el.querySelector(".prose");
      prose.querySelectorAll("table").forEach((t) => {
        const w = document.createElement("div"); w.className = "table-wrap";
        t.replaceWith(w); w.append(t);
      });
      prose.querySelectorAll("img").forEach((img) => {
        const alt = (img.getAttribute("alt") || "").trim();
        if (!alt || alt === "사진 설명을 입력하세요") return;
        const fig = document.createElement("figure");
        const host = img.parentElement.tagName === "P" && img.parentElement.childNodes.length === 1 ? img.parentElement : img;
        host.replaceWith(fig);
        fig.append(img);
        fig.insertAdjacentHTML("beforeend", `<figcaption>${esc(alt)}</figcaption>`);
      });

      // 공유: 썸네일이 붙는 공유용 주소(/p/글주소.html)를 씁니다
      const shareUrl = `${CONFIG.SITE_URL}/p/${post.slug}.html`;
      const btn = document.getElementById("share");
      btn.addEventListener("click", async () => {
        if (navigator.share && matchMedia("(pointer: coarse)").matches) {
          try { await navigator.share({ title: post.title, text: post.excerpt || "", url: shareUrl }); return; } catch { return; }
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          btn.querySelector("span").textContent = "링크를 복사했습니다";
        } catch {
          prompt("아래 주소를 복사하세요", shareUrl);
        }
        setTimeout(() => (btn.querySelector("span").textContent = "공유하기"), 2200);
      });
      // 조회 기록 (뉴스레터에서 들어왔는지 구분)
      logPageView(post.slug, params.get("utm_source")).catch(() => {});
    }
  </script>
</body>
</html>
